[general]
verbose = false
watchdog = 10
print_every = 0
stats_interval = 10

[net]
udp_port = 2100
udp_dest = 255.255.255.255
udp_bcast = true
tcp_control_port = 2121

[data]
data_width = 32
pad_bits = 0
addr_width = 10
reread_status = true
fft_is_real = true

# General registers here
[reg]
accum_len = 0x40008000
valid_counts = 0x40008044
total_counts = 0xl0008040
clk_cnts= 0x40008028
pps_duration = 0x40008030
pps_counter = 0x4000802c
threshold = 0x40008038
toggle = 0x4000803c
sys_rev = 0x40008084


[snap.0]
bram = 0x40000000
ctrl = 0x40008004
status = 0x40008008
val = 0x4000800c
arm = 0x40008020

[snap.1]
bram = 0x40004000
ctrl = 0x40008010
status = 0x40008014
val = 0x40008018
arm = 0x40008024


# can repeat up until [snap.N]
